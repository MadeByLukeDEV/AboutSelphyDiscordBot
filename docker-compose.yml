# Starts both services (the dashboard and the bot) from this one file.
#
# Dokploy: create a "Compose" application from this repository (build path "/", compose file
# "docker-compose.yml"), put the variables of .env.example in its Environment tab, and add the
# domain (for example bot.aboutselphy.com) to the `dashboard` service, container port 3000.
# The bot has no domain: its internal API is only reachable from the dashboard over the compose
# network and must never be published.
#
# Locally:   docker compose --env-file .env.local up --build
#
# Network: both services also join Dokploy's shared network (dokploy-network). That is what lets them
# reach the Postgres service by its internal name (for example services-postgresql-xxxxx:5432) and lets
# Traefik reach the dashboard. They still talk to each other as dashboard / bot.
#
# Start order: migrate (one-shot: applies the database migrations and exits) -> bot -> dashboard.
# The migrations are applied by the `migrate` service only (the dashboard no longer does it), so the bot never
# runs against an old schema, and the bot's internal API is already up when the dashboard starts serving pages.
# The dashboard waits for the bot to be STARTED, not healthy: a Discord outage must never keep the dashboard
# (and with it the settings) from starting.

services:
  # One-shot: applies pending migrations with the dashboard image's Prisma CLI, then exits.
  migrate:
    image: aboutselphy-dashboard:compose
    pull_policy: never
    restart: "no"
    command: ["sh", "-c", "cd /app/packages/db && node_modules/.bin/prisma migrate deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-bot}
    networks:
      - default
      - dokploy-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    pids_limit: 512

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        # Baked into the client code at build time: change it (and rebuild) for another domain.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://bot.aboutselphy.com}
    image: aboutselphy-dashboard:compose
    restart: always
    # The image's default command migrates first; the migrate service did that already.
    command: ["sh", "-c", "exec node_modules/.bin/next start"]
    depends_on:
      bot:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-bot}
      AUTH_URL: ${AUTH_URL:-https://auth.aboutselphy.com}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?set AUTH_DATABASE_URL}
      AUTH_DATABASE_SCHEMA: ${AUTH_DATABASE_SCHEMA:-auth}
      AUTH_COOKIE_PREFIX: ${AUTH_COOKIE_PREFIX:-better-auth}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      # The bot's address on the compose network (the service name below).
      BOT_API_URL: http://bot:3100
      BOT_API_SECRET: ${BOT_API_SECRET:?set BOT_API_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      # "Link with Discord" (Twitch VIP role): the Discord application's ID and OAuth secret.
      DISCORD_APP_ID: ${DISCORD_APP_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # For the public /terms and /privacy pages (who runs the bot). Not secret.
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_COUNTRY: ${LEGAL_COUNTRY:-}
      LEGAL_HOSTING: ${LEGAL_HOSTING:-}
    expose:
      - "3000"
    networks:
      - default
      - dokploy-network
    # Defence in depth: the process runs as the unprivileged "node" user already; this also removes every
    # Linux capability and forbids gaining new privileges. A runaway process can't fork without limit.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    pids_limit: 512
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      BOT_ENV: production
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN}
      DISCORD_APP_ID: ${DISCORD_APP_ID:?set DISCORD_APP_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?set DISCORD_GUILD_ID}
      DISCORD_ADMIN_ROLE_IDS: ${DISCORD_ADMIN_ROLE_IDS:-}
      DISCORD_MODERATOR_ROLE_IDS: ${DISCORD_MODERATOR_ROLE_IDS:-}
      DISCORD_MESSAGE_CONTENT: ${DISCORD_MESSAGE_CONTENT:-false}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-bot}
      BOT_API_SECRET: ${BOT_API_SECRET:?set BOT_API_SECRET}
      BOT_API_PORT: "3100"
      # Reachable by the dashboard over the compose network; the port is not published.
      BOT_API_HOST: 0.0.0.0
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      DASHBOARD_URL: ${NEXT_PUBLIC_SITE_URL:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID:-}
      # Internal hosts the feed announcer may read (a feed bridge such as RSSHub), comma separated.
      RSS_INTERNAL_HOSTS: ${RSS_INTERNAL_HOSTS:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
      AI_MAX_CALLS_PER_DAY: ${AI_MAX_CALLS_PER_DAY:-}
      CRAWL4AI_URL: ${CRAWL4AI_URL:-}
      CRAWL4AI_TOKEN: ${CRAWL4AI_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # No ports and no domain: only the dashboard talks to the bot. The image has its own HEALTHCHECK.
    stop_grace_period: 20s
    networks:
      - default
      - dokploy-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    pids_limit: 512

networks:
  dokploy-network:
    external: true
