packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  '@swc/core': true
  sharp: false
  unrs-resolver: false
  bufferutil: false
  utf-8-validate: false
  zlib-sync: false
  '@parcel/watcher': set this to true or false

overrides:
  # @swc/core >= 1.16.3 refuses to load its native addon when its cache dir or
  # an ancestor is writable by groups like Authenticated Users
  # (ERR_SWC_NATIVE_CACHE; true for D:\Work on this machine). next-intl pulls
  # it in. Main/Social are on 1.16.2. Remove once SWC relaxes the check.
  "@swc/core": 1.16.2
  # prisma@7.10.0 pins mysql2 3.15.3 (high CVE, only used by Prisma Studio for
  # MySQL, never by this Postgres app). Remove when Prisma ships a fix.
  mysql2: ^3.24.4
